name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - main.dart
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project and add main.dart
        run: | flutter create --platforms=android --org com.coolday --project-name cool_day_store app cp main.dart app/lib/main.dart cd app flutter pub add http intl 
      - name: Android settings (internet permission + app name)
        run: | MANIFEST=app/android/app/src/main/AndroidManifest.xml grep -q "android.permission.INTERNET" "$MANIFEST" || \ perl -0pi -e 's/(<manifest[^>]*>)/$1\n <uses-permission android:name="android.permission.INTERNET"\/>/' "$MANIFEST" sed -i 's/android:label="[^"]*"/android:label="Cool Day Store"/' "$MANIFEST" grep -n "INTERNET\|android:label" "$MANIFEST" 
      - name: Check code (does not stop the build)
        run: | cd app flutter analyze --no-fatal-infos --no-fatal-warnings || true 
      - name: Build APK
        run: | cd app flutter build apk --release 
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: cool-day-apk-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
